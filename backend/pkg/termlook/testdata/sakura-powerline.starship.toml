# Generated by Yozakura from the "sakura-powerline" prompt preset; regenerated on theme change.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "yozakura"
format = "$os$directory$git_branch$git_status$nodejs$python$golang$rust$java$cmd_duration[\uE0B0](fg:prev_bg) $character"

[palettes.yozakura]
primary = "#f5adff"
on_primary = "#520e62"
secondary = "#e0bbe2"
on_secondary = "#412745"
tertiary = "#ffb2bd"
on_tertiary = "#620b25"
surface = "#171217"
surface_high = "#2e282e"
on_surface = "#ebdfe7"
outline = "#9a8d99"
error = "#ffb4ab"
on_error = "#690005"
success = "#b7d085"

[os]
disabled = false
format = "[ $symbol ](fg:on_primary bg:primary)"

[os.symbols]
Alpine = "\uF300"
Arch = "\uF303"
Artix = "\uF31F"
Debian = "\uF306"
EndeavourOS = "\uF322"
Fedora = "\uF30A"
Garuda = "\uF337"
Gentoo = "\uF30D"
Linux = "\uF31A"
Macos = "\uF179"
Manjaro = "\uF312"
Mint = "\uF30E"
NixOS = "\uF313"
openSUSE = "\uF314"
Pop = "\uF32A"
Ubuntu = "\uF31B"
Void = "\uF32E"

[directory]
format = "[\uE0B0](fg:prev_bg bg:secondary)[ \uF07C $path$read_only ](bold fg:on_secondary bg:secondary)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " \uF023"

[git_branch]
format = "[\uE0B0](fg:prev_bg bg:tertiary)[ \uE725 $branch ](fg:on_tertiary bg:tertiary)"

[git_status]
format = "([\uE0B0](fg:prev_bg bg:tertiary)[ $all_status$ahead_behind ](fg:on_tertiary bg:tertiary))"

[nodejs]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uE718 $version ](fg:primary bg:surface_high)"

[python]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uE73C $version ](fg:primary bg:surface_high)"

[golang]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uE627 $version ](fg:primary bg:surface_high)"

[rust]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uE7A8 $version ](fg:primary bg:surface_high)"

[java]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uE738 $version ](fg:primary bg:surface_high)"

[cmd_duration]
format = "[\uE0B0](fg:prev_bg bg:surface_high)[ \uF252 $duration ](fg:tertiary bg:surface_high)"
min_time = 2000

[character]
format = "$symbol "
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❯](bold fg:secondary)"
