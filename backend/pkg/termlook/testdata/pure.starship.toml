# Generated by Yozakura from the "pure" prompt preset; regenerated on theme change.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "yozakura"
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[palettes.yozakura]
primary = "#f5adff"
on_primary = "#520e62"
secondary = "#e0bbe2"
on_secondary = "#412745"
tertiary = "#ffb2bd"
on_tertiary = "#620b25"
surface = "#171217"
surface_high = "#2e282e"
on_surface = "#ebdfe7"
outline = "#9a8d99"
error = "#ffb4ab"
on_error = "#690005"
success = "#b7d085"

[directory]
format = "[$path$read_only](fg:primary) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " \uF023"

[git_branch]
format = "[$branch](fg:outline) "

[git_status]
format = "([$all_status$ahead_behind](fg:secondary) )"

[cmd_duration]
format = "[$duration](fg:tertiary) "
min_time = 2000

[character]
format = "$symbol "
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❯](bold fg:secondary)"
