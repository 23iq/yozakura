# Generated by Yozakura from the "capsule-right" prompt preset; regenerated on theme change.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "yozakura"
format = "$directory$git_branch$git_status$character"
right_format = "$status$cmd_duration$time"

[palettes.yozakura]
primary = "#f5adff"
on_primary = "#520e62"
secondary = "#e0bbe2"
on_secondary = "#412745"
tertiary = "#ffb2bd"
on_tertiary = "#620b25"
surface = "#171217"
surface_high = "#2e282e"
on_surface = "#ebdfe7"
outline = "#9a8d99"
error = "#ffb4ab"
on_error = "#690005"
success = "#b7d085"

[directory]
format = "[\uE0B6](fg:primary)[\uF07C $path$read_only](bold fg:on_primary bg:primary)[\uE0B4](fg:primary) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " \uF023"

[git_branch]
format = "[\uE0B6](fg:secondary)[\uE725 $branch](fg:on_secondary bg:secondary)[\uE0B4](fg:secondary) "

[git_status]
format = "([\uE0B6](fg:surface_high)[$all_status$ahead_behind](fg:secondary bg:surface_high)[\uE0B4](fg:surface_high) )"

[status]
disabled = false
format = " [\uE0B6](fg:error)[\uF00D $status](fg:on_error bg:error)[\uE0B4](fg:error)"

[cmd_duration]
format = " [\uE0B6](fg:surface_high)[\uF252 $duration](fg:tertiary bg:surface_high)[\uE0B4](fg:surface_high)"
min_time = 2000

[time]
disabled = false
format = " [\uE0B6](fg:tertiary)[\uF017 $time](fg:on_tertiary bg:tertiary)[\uE0B4](fg:tertiary)"
time_format = "%H:%M"

[character]
format = "$symbol "
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❯](bold fg:secondary)"
