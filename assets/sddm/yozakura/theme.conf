; Yozakura SDDM theme defaults.
;
; Live values are written by scripts/sddm-sync.sh into
; /var/lib/yozakura-sddm/theme.conf, which the installer links here as
; theme.conf.user (SDDM reads <ConfigFile>.user on top of this file).
; Every key is optional: Main.qml falls back to built-in defaults.
[General]
background=""
backgroundBlurred=""
avatar=""
avatarUser=""
font="Google Sans Flex"
fontFile=""
iconFont="Phosphor-Bold"
iconFontFile=""
fontSize=14
roundness=16
use12h=false
position="bottom"
enableCorners=true
; Lock screen style (styles/, see Styles.js) and its tone ("light"/"dark");
; synced from the shell's lockscreen.style / lockscreen.tone.
style="glass"
tone=""
blur=-1
