name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build binaries
        working-directory: backend
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            echo "Building linux/$arch..."
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -mod=vendor -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../dist/yozakura-linux-$arch" ./cmd/yozakura
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -mod=vendor -trimpath \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o "../dist/yozd-linux-$arch" ./cmd/yozd
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum yozakura-linux-* yozd-linux-* > SHA256SUMS

      # The update channels compare the version file with the tags
      # (backend/pkg/updatechannel): a tag whose version file says
      # otherwise makes installs on it look older or newer than they are.
      - name: Check the version file
        run: |
          if [ "$(tr -d '[:space:]' < version)" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::warning::version file says $(cat version), the tag is $GITHUB_REF_NAME"
          fi

      # X.Y.Z-beta.N tags are pre-releases for the beta channel: never the
      # "latest" release that stable installs download binaries from.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
          *-beta.*) flags=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
