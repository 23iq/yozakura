name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Toolchain pins. Keep these in step with the dev machine (Arch): the qmllint
# and qmlformat baselines in tools/lint/baselines were recorded with Qt 6.11.2
# and Quickshell 0.3.1, and findings differ across Qt / Quickshell releases.
# The shared setup (.github/actions/setup-toolchain) reads them from here.
env:
  PYSIDE6_VERSION: "6.11.2"
  QUICKSHELL_PKG: quickshell-0.3.1-1-x86_64.pkg.tar.zst
  RUFF_VERSION: "0.16.10"
  STATICCHECK_VERSION: v0.8.1

# Jobs run in parallel: lint, the node + Go tests, the Python QML tests in
# timing-balanced shards (tests/timings.json), the nix build. `check`
# aggregates the first three under the job name branch protection requires.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          lint-tools: "true"
      - uses: ./.github/actions/make-check
        with:
          checks: parse-qml lint-qml fmt-check lint-go lint-sh lint-py audit

  test-go-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          pyside6: "false"
      - uses: ./.github/actions/make-check
        with:
          checks: test-js test-go

  test-py:
    name: test-py (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      YOZAKURA_TEST_SHARD: ${{ matrix.shard }}
      YOZAKURA_TEST_JOBS: "4"
      # A failure is re-run once, serially; a pass then is reported as flaky.
      YOZAKURA_TEST_RETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/make-check
        with:
          checks: test-py

  check:
    if: always()
    needs: [lint, test-go-js, test-py]
    runs-on: ubuntu-24.04
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            [ "$r" = success ] || { echo "::error::a gate did not pass (${r})"; exit 1; }
          done

  # The flake (package, SDDM theme, NixOS module): builds what NixOS users
  # install and evaluates a system with every module option on.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package and the SDDM theme
        run: nix build --print-build-logs .#default .#sddm-theme

      - name: Evaluate NixOS systems with the module (with and without TLP)
        run: |
          for tlp in false true; do
            nix eval --raw --impure --expr "(import ./nix/tests/eval.nix { flake = builtins.getFlake (toString ./.); tlp = $tlp; }).config.system.build.toplevel.drvPath"
            echo
          done
