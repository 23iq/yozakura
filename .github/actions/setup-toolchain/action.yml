name: Set up the check toolchain
description: >
  Go, node, Python, the system libraries (cached), PySide6 (qmllint/qmlformat
  and the QML test runtime) and optionally ruff, Quickshell's QML module and
  staticcheck. The pins come from the calling workflow's env
  (PYSIDE6_VERSION, QUICKSHELL_PKG, RUFF_VERSION, STATICCHECK_VERSION), so
  they live in one place: .github/workflows/check.yml.

inputs:
  pyside6:
    description: Install the pinned PySide6 (QML tests, qmllint, qmlformat)
    default: "true"
  lint-tools:
    description: Install ruff, staticcheck and Quickshell's QML type metadata
    default: "false"

runs:
  using: composite
  steps:
    - id: go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          .github/workflows/check.yml
          .github/actions/setup-toolchain/action.yml

    # PySide6's xcb platform plugin (GL tests run under a private Xvfb) and
    # QtMultimedia need these system libraries; ffmpeg is used by tests to
    # synthesise wallpapers and videos (Python and Go). Cached as .deb
    # contents; bump `version` to force a fresh download.
    - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        version: "1"
        packages: >-
          shellcheck xvfb ffmpeg zstd
          libegl1 libgl1 libgl1-mesa-dri libfontconfig1 libfreetype6 libdbus-1-3
          libglib2.0-0t64 libpulse0 libx11-6 libx11-xcb1
          libxkbcommon0 libxkbcommon-x11-0
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0
          libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1

    # A cache hit above unpacks the package files without running their
    # postinst, so the update-alternatives links of BLAS / LAPACK (ffmpeg
    # links them) are missing and ffmpeg dies with "libblas.so.3: cannot open
    # shared object file". Put the links back and prove ffmpeg starts.
    - name: BLAS / LAPACK links for ffmpeg
      shell: bash
      run: |
        libdir=/usr/lib/x86_64-linux-gnu
        for lib in blas lapack; do
          if [ ! -e "${libdir}/lib${lib}.so.3" ] && [ -e "${libdir}/${lib}/lib${lib}.so.3" ]; then
            sudo ln -s "${libdir}/${lib}/lib${lib}.so.3" "${libdir}/lib${lib}.so.3"
          fi
        done
        sudo ldconfig
        ffmpeg -hide_banner -version > /dev/null

    # PySide6 wheels ship qmllint/qmlformat built from the same Qt release.
    - name: PySide6
      if: inputs.pyside6 == 'true'
      shell: bash
      run: |
        python -m pip install "PySide6==${PYSIDE6_VERSION}"
        qt_dir=$(python -c 'import os, PySide6; print(os.path.dirname(PySide6.__file__))')
        echo "QMLLINT=${qt_dir}/qmllint" >> "$GITHUB_ENV"
        echo "QMLFORMAT=${qt_dir}/qmlformat" >> "$GITHUB_ENV"
        "${qt_dir}/qmllint" --version
        "${qt_dir}/qmlformat" --version

    - name: ruff
      if: inputs.lint-tools == 'true'
      shell: bash
      run: python -m pip install "ruff==${RUFF_VERSION}"

    # qmllint needs Quickshell's QML type metadata (qmldir + qmltypes); take
    # it from the pinned Arch package rather than building Quickshell.
    - name: Cache Quickshell QML module
      if: inputs.lint-tools == 'true'
      id: qs-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/quickshell-qml
        key: quickshell-qml-${{ env.QUICKSHELL_PKG }}

    - name: Fetch Quickshell QML module
      if: inputs.lint-tools == 'true' && steps.qs-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/quickshell-qml
        curl -fsSL --retry 3 -o /tmp/qs.pkg.tar.zst \
          "https://archive.archlinux.org/packages/q/quickshell/${QUICKSHELL_PKG}"
        tar --zstd -xf /tmp/qs.pkg.tar.zst -C ~/.cache/quickshell-qml usr/lib/qt6/qml/Quickshell

    - name: Quickshell import path
      if: inputs.lint-tools == 'true'
      shell: bash
      run: echo "QMLLINT_IMPORT_PATH=$HOME/.cache/quickshell-qml/usr/lib/qt6/qml" >> "$GITHUB_ENV"

    - name: Cache staticcheck
      if: inputs.lint-tools == 'true'
      id: sc-cache
      uses: actions/cache@v4
      with:
        path: ~/go/bin/staticcheck
        key: staticcheck-${{ env.STATICCHECK_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}

    - name: staticcheck
      if: inputs.lint-tools == 'true' && steps.sc-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
